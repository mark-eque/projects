const analyzed = {};
let liveMode = false;
let activeId = null;

function scoreColor(s) { return s>=75?"#4caf7d":s>=50?"#e8a838":"#e05c5c"; }

function trendBadge(data) {
  const diff = data[data.length-1] - data[0];
  const pct = Math.round(Math.abs(diff/data[0])*100);
  const col = diff>=0?"#4caf7d":"#e05c5c";
  return `<span style="font-size:10px;font-family:'DM Mono',monospace;color:${col};font-weight:500">${diff>=0?"↑":"↓"}${pct}%</span>`;
}

function miniBar(score) {
  const col = scoreColor(score);
  return `<div class="mini-bar-track"><div class="mini-bar-fill" style="width:${score}%;background:${col}"></div></div>`;
}

function scoreArc(score, size=64) {
  const c=size/2, r=(size-10)/2, circ=2*Math.PI*r, fill=(score/100)*circ, col=scoreColor(score);
  return `<svg width="${size}" height="${size}" style="flex-shrink:0">
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="5"/>
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${col}" stroke-width="5"
      stroke-dasharray="${fill.toFixed(1)} ${circ.toFixed(1)}" stroke-linecap="round"
      transform="rotate(-90 ${c} ${c})"/>
    <text x="${c}" y="${c+5}" text-anchor="middle" font-size="13" font-weight="500" fill="${col}" font-family="DM Mono,monospace">${score}</text>
  </svg>`;
}

function trendChart(data, color) {
  const w=240,h=68,px=10,py=8;
  const labels=["5w","4w","3w","2w","1w","Now"];
  const mn=Math.max(0,Math.min(...data)-12), mx=Math.min(100,Math.max(...data)+12), rng=mx-mn||1;
  const pts=data.map((v,i)=>[+(px+(i/(data.length-1))*(w-px*2)).toFixed(1), +(py+(1-(v-mn)/rng)*(h-py*2)).toFixed(1)]);
  const poly=pts.map(p=>p.join(",")).join(" ");
  const fill=`${pts[0][0]},${h} ${poly} ${pts[pts.length-1][0]},${h}`;
  const grid=[25,50,75].map(v=>{
    const y=py+(1-(v-mn)/rng)*(h-py*2);
    if(y<py-2||y>h-py+2) return "";
    return `<line x1="${px}" y1="${y.toFixed(1)}" x2="${w-px}" y2="${y.toFixed(1)}" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <text x="${px-3}" y="${(y+3).toFixed(1)}" font-size="7" fill="rgba(255,255,255,0.18)" text-anchor="end" font-family="DM Mono,monospace">${v}</text>`;
  }).join("");
  const dots=pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${color}"/>
    <text x="${p[0]}" y="${h-1}" font-size="7" fill="rgba(255,255,255,0.22)" text-anchor="middle" font-family="DM Mono,monospace">${labels[i]}</text>`).join("");
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" style="display:block;overflow:visible">
    <defs><linearGradient id="cg${color.replace('#','')}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}<polygon points="${fill}" fill="url(#cg${color.replace('#','')})"/>
    <polyline points="${poly}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
  </svg>`;
}

function buildPrompt(c) {
  const all=[
    ...c.interactions.email.map(m=>`EMAIL (${m.date}) — ${m.label}: "${m.text}"`),
    ...c.interactions.slack.map(m=>`SLACK (${m.date}) — ${m.label}: "${m.text}"`),
    ...(c.interactions.calls||[]).map(m=>`CALL (${m.date}) — ${m.label}: "${m.text}"`)
  ].join("\n\n");
  return `You are an EQ analysis engine for CSMs and AEs. Analyze communication data and return ONLY valid JSON, no markdown:\n{"overall_eq_score":<0-100>,"overall_summary":"<1 crisp sentence>","mood_now":"<3-5 words>","dimension_scores":{"depth":{"score":<0-100>,"insight":"<6-8 words>"},"reciprocity":{"score":<0-100>,"insight":"<6-8 words>"},"momentum":{"score":<0-100>,"insight":"<6-8 words>"},"tone":{"score":<0-100>,"insight":"<6-8 words>"}},"risk_flags":[],"coaching_tips":[{"tip":"<bold action 8-12 words>","note":"<5-7 word signal>"},{"tip":"<action>","note":"<signal>"},{"tip":"<action>","note":"<signal>"}],"next_best_action":"<imperative, 10 words max>"}\n\nContact: ${c.name}, ${c.role}\nDims: Depth: ${c.dims.depth} | Reciprocity: ${c.dims.reciprocity} | Momentum: ${c.dims.momentum} | Tone: ${c.dims.tone}\n\n${all}`;
}

  }).join("");

  </div>
  ${liveMode?`<div style="padding:8px 10px;border-radius:6px;background:rgba(76,175,125,0.06);border:0.5px solid rgba(76,175,125,0.15);margin-bottom:4px">
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
      <div style="width:5px;height:5px;border-radius:50%;background:#4caf7d;animation:pulse 1.5s infinite"></div>
      <span style="font-size:10px;color:#4caf7d;font-family:'DM Mono',monospace">Listening...</span>
    </div>
    <p style="font-size:10px;color:rgba(255,255,255,0.3);line-height:1.5">Tone, sentiment &amp; expression signals will update EQ scores in real time during your call.</p>
  </div>`:""}`;
}

function toggleLive() {
  liveMode = !liveMode;
  if (activeId !== null && analyzed[activeId]) {
    renderDetail(contacts.find(c=>c.id===activeId), analyzed[activeId]);
  } else if (activeId !== null) {
    const liveSection = document.getElementById('live-section');
    if (liveSection) liveSection.innerHTML = renderLiveBtn();
  }
}

async function openContact(id) {
  activeId = id;
  liveMode = false;
  const c = contacts.find(x=>x.id===id);
  document.getElementById('overview-pane').style.display = 'none';
  const det = document.getElementById('detail-pane');
  det.style.display = 'flex';
  renderContactList();

  if (analyzed[id]) { renderDetail(c, analyzed[id]); return; }

  det.innerHTML = `
    <button class="back-btn" onclick="goBack()" style="display:flex;align-items:center;gap:5px;font-size:11px;color:rgba(255,255,255,0.32);background:none;border:none;cursor:pointer;margin-bottom:8px;transition:color 0.15s">← all contacts</button>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <div class="avatar">${c.initials}</div>
      <div><p style="font-size:14px;font-weight:500;color:rgba(255,255,255,0.9)">${c.name}</p>
      <p style="font-size:11px;color:rgba(255,255,255,0.35)">${c.role} · ${c.company}</p></div>
    </div>
    <div id="live-section">${renderLiveBtn()}</div>
    <div style="text-align:center;padding:2rem 0">
      <div class="spinner"></div>
      <div style="font-size:11px;color:rgba(255,255,255,0.28);font-family:'DM Mono',monospace">analyzing signals...</div>
    </div>`;

  try {
    const res = await fetch("/api/analyze",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-5",max_tokens:1000,messages:[{role:"user",content:buildPrompt(c)}]})
    });
    const data = await res.json();
    const text = data.content.map(b=>b.text||"").join("");
    const parsed = JSON.parse(text.replace(/```json|```/g,"").trim());
    analyzed[id] = parsed;
    renderDetail(c, parsed);
    renderContactList();
    renderInbox();
  } catch(e) {
    det.innerHTML += `<div style="padding:10px;background:rgba(224,92,92,0.1);border:0.5px solid rgba(224,92,92,0.2);border-radius:8px;font-size:12px;color:#e05c5c;margin-top:8px">Analysis failed. Try again.</div>`;
  }
}

function renderDetail(c, r) {
  const score = r.overall_eq_score;
  const col = scoreColor(score);
  const tips = (r.coaching_tips||r.coaching_nudges||[]).map(n=>`
    <div class="nudge">
      <p style="font-size:12px;font-weight:600;color:rgba(255,255,255,0.85);margin:0 0 3px;line-height:1.5">${n.tip||n.nudge}</p>
      ${(n.note||n.why)?`<p style="font-size:10px;color:rgba(255,255,255,0.32);margin:0;line-height:1.4">${n.note||n.why}</p>`:""}
    </div>`).join("");
  const dims = Object.entries(r.dimension_scores).map(([d,v])=>`
    <div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;margin-bottom:3px">
        <span style="font-size:11px;color:rgba(255,255,255,0.38);text-transform:capitalize">${d}</span>
        <span style="font-size:11px;color:${scoreColor(v.score)};font-family:'DM Mono',monospace">${v.score}</span>
      </div>
      ${miniBar(v.score)}
      <p style="font-size:10px;color:rgba(255,255,255,0.28);margin:3px 0 0;line-height:1.4">${v.insight}</p>
    </div>`).join("");
  const risks = (r.risk_flags||[]).length?`
    <div style="margin-bottom:4px">
      <div class="card-label" style="margin-bottom:6px">⚠ Risk flags</div>
      ${r.risk_flags.map(f=>`<div class="risk-flag"><p style="font-size:11px;color:#e05c5c;margin:0;line-height:1.5">${f}</p></div>`).join("")}
    </div>`:"";

  document.getElementById('detail-pane').innerHTML = `
    <button class="back-btn" onclick="goBack()" style="display:flex;align-items:center;gap:5px;font-size:11px;color:rgba(255,255,255,0.32);background:none;border:none;cursor:pointer;margin-bottom:8px;transition:color 0.15s">← all contacts</button>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <div class="avatar">${c.initials}</div>
      <div style="flex:1">
        <p style="font-size:14px;font-weight:500;color:rgba(255,255,255,0.9)">${c.name}</p>
        <p style="font-size:11px;color:rgba(255,255,255,0.35)">${c.role} · ${c.company}</p>
        <div style="display:flex;align-items:center;gap:6px;margin-top:3px">
          ${trendBadge(c.trend)}
          <span style="font-size:9px;color:${c.renewal<=30?"#e05c5c":"rgba(255,255,255,0.22)"};font-family:'DM Mono',monospace">renewal in ${c.renewal}d</span>
        </div>
      </div>
    </div>
    <div id="live-section">${renderLiveBtn()}</div>
    <div class="card fade" style="display:flex;align-items:center;gap:12px;margin-bottom:0">
      ${scoreArc(score,64)}
      <div style="flex:1">
        <div class="card-label">EQ score</div>
        <div style="font-size:11px;color:rgba(255,255,255,0.55);line-height:1.6">${r.overall_summary}</div>
        ${r.mood_now?`<div style="margin-top:5px;display:inline-block;padding:2px 7px;background:rgba(255,255,255,0.06);border-radius:4px;font-size:9px;color:rgba(255,255,255,0.38);font-family:'DM Mono',monospace">${r.mood_now}</div>`:""}
      </div>
    </div>
    <div class="fade">
      <div class="card-label">Next best action</div>
      <div class="nba"><p style="font-size:12px;color:#4caf7d;font-weight:500;margin:0;line-height:1.5">${r.next_best_action}</p></div>
    </div>
    <div class="fade">
      <div class="card-label">Coaching tips</div>
      ${tips}
    </div>
    ${risks}
    <div class="card fade">
      <div class="card-label">EQ trend — 6 weeks</div>
      ${trendChart(c.trend, col)}
    </div>
    <div class="card fade">
      <div class="card-label">Analysis</div>
      ${dims}
    </div>`;
}

function goBack() {
  activeId = null;
  liveMode = false;
  document.getElementById('detail-pane').style.display = 'none';
  document.getElementById('overview-pane').style.display = 'flex';
  renderContactList();
}

renderContactList();
renderInbox();
</script>
</body>
</html>
