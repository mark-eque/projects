
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>eqlayer — Relationship Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0a0a0c;display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(76,175,125,0.5)}50%{box-shadow:0 0 0 6px rgba(76,175,125,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px}
#app{width:860px;max-width:100vw;border-radius:14px;overflow:hidden;display:flex;height:600px;background:#0d0d0f;box-shadow:0 24px 80px rgba(0,0,0,0.6)}
.mock{flex:1;background:#111113;display:flex;flex-direction:column;overflow:hidden}
.mock-winbar{display:flex;align-items:center;gap:7px;padding:12px 16px;background:#0e0e10;border-bottom:0.5px solid rgba(255,255,255,0.06);flex-shrink:0}
.mock-dot{width:10px;height:10px;border-radius:50%}
.mock-urlbar{flex:1;margin-left:10px;background:rgba(255,255,255,0.05);border-radius:5px;padding:4px 10px}
.mock-topbar{display:flex;align-items:center;padding:10px 16px;border-bottom:0.5px solid rgba(255,255,255,0.05);flex-shrink:0;gap:12px}
.mock-search{flex:1;max-width:300px;background:rgba(255,255,255,0.05);border:0.5px solid rgba(255,255,255,0.09);border-radius:20px;padding:5px 12px}
.mock-avatar-g{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#5b9bd5,#9b8ee8);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;font-family:'DM Mono',monospace}
.mock-tabs{display:flex;padding:0 16px;border-bottom:0.5px solid rgba(255,255,255,0.06);flex-shrink:0}
.mock-tab{padding:8px 14px;font-size:12px;cursor:default}
.mock-banner{display:flex;align-items:center;gap:8px;padding:7px 16px;background:rgba(91,155,213,0.07);border-bottom:0.5px solid rgba(91,155,213,0.12);flex-shrink:0}
.mock-emails{padding:10px 12px;flex:1;overflow-y:auto}
.mock-email{background:#161618;border-radius:10px;padding:12px 14px;border:0.5px solid rgba(255,255,255,0.07);margin-bottom:8px}
.sidebar{width:272px;min-width:272px;background:#13131a;border-left:0.5px solid rgba(255,255,255,0.07);display:flex;flex-direction:column;overflow:hidden;height:100%}
.sb-header{padding:14px 14px 10px;border-bottom:0.5px solid rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.logo{font-size:14px;font-weight:600;color:#fff;letter-spacing:-0.01em}
.logo span{color:#5b9bd5}
.logo-sub{font-size:9px;color:rgba(255,255,255,0.28);font-family:'DM Mono',monospace;letter-spacing:0.06em}
.overview{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.contact-list{flex:1;overflow-y:auto;padding:8px}
.crow{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;margin-bottom:2px;transition:all 0.15s;border:0.5px solid transparent}
.crow:hover{background:rgba(255,255,255,0.05)}
.crow.active{background:rgba(255,255,255,0.07);border-color:rgba(255,255,255,0.1)}
.avatar{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.07);border:1.5px solid rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:rgba(255,255,255,0.5);font-family:'DM Mono',monospace;flex-shrink:0}
.sb-footer{padding:8px 10px 12px;border-top:0.5px solid rgba(255,255,255,0.06);flex-shrink:0}
.detail{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;display:none}
.card{background:rgba(255,255,255,0.04);border:0.5px solid rgba(255,255,255,0.08);border-radius:10px;padding:12px}
.clabel{font-size:9px;color:rgba(255,255,255,0.28);text-transform:uppercase;letter-spacing:0.07em;font-family:'DM Mono',monospace;margin-bottom:7px}
.nudge{padding:9px 11px;background:rgba(91,155,213,0.08);border:0.5px solid rgba(91,155,213,0.15);border-radius:8px;margin-bottom:6px}
.nba{padding:10px 12px;background:rgba(76,175,125,0.1);border:0.5px solid rgba(76,175,125,0.25);border-radius:8px}
.risk{padding:8px 10px;background:rgba(224,92,92,0.08);border:0.5px solid rgba(224,92,92,0.18);border-radius:7px;margin-bottom:5px}
.bar-track{height:3px;background:rgba(255,255,255,0.1);border-radius:2px;overflow:hidden;margin-top:4px}
.bar-fill{height:3px;border-radius:2px}
.spinner{width:22px;height:22px;border:2px solid rgba(255,255,255,0.08);border-top:2px solid #5b9bd5;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 10px}
.back-btn{display:flex;align-items:center;gap:5px;font-size:11px;color:rgba(255,255,255,0.32);background:none;border:none;cursor:pointer;margin-bottom:8px;transition:color 0.15s;flex-shrink:0}
.back-btn:hover{color:rgba(255,255,255,0.7)}
.live-btn{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:8px;cursor:pointer;margin-bottom:6px;transition:all 0.2s}
.fade{animation:fadeUp 0.25s ease forwards}
</style>
</head>
<body>
<div id="app">
  <!-- Mock Gmail -->
  <div class="mock">
    <div class="mock-winbar">
      <div class="mock-dot" style="background:#e05c5c"></div>
      <div class="mock-dot" style="background:#e8a838"></div>
      <div class="mock-dot" style="background:#4caf7d"></div>
      <div class="mock-urlbar"><span style="font-size:11px;color:rgba(255,255,255,0.22);font-family:'DM Mono',monospace">mail.google.com</span></div>
    </div>
    <div class="mock-topbar">
      <span style="font-size:14px;font-weight:500;color:rgba(255,255,255,0.65)">Gmail</span>
      <div class="mock-search"><span style="font-size:12px;color:rgba(255,255,255,0.22)">Search mail</span></div>
      <div class="mock-avatar-g">M</div>
    </div>
    <div class="mock-tabs">
      <div class="mock-tab" style="color:rgba(255,255,255,0.7);border-bottom:2px solid #5b9bd5">Primary</div>
      <div class="mock-tab" style="color:rgba(255,255,255,0.25)">Promotions</div>
      <div class="mock-tab" style="color:rgba(255,255,255,0.25)">Updates</div>
    </div>
    <div class="mock-banner">
      <span style="font-size:11px;color:rgba(91,155,213,0.85);font-family:'DM Mono',monospace">&#9432; Sample data — tap any contact in eqlayer to generate a live EQ analysis</span>
    </div>
    <div class="mock-emails" id="inbox"></div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sb-header">
      <div>
        <div class="logo">eq<span>layer</span></div>
        <div class="logo-sub">RELATIONSHIP INTELLIGENCE</div>
      </div>
      <div id="analyzed-count" style="font-size:9px;color:rgba(255,255,255,0.22);font-family:'DM Mono',monospace">0/5 analyzed</div>
    </div>

    <!-- Overview -->
    <div class="overview" id="overview">
      <div class="contact-list" id="contact-list"></div>
      <div class="sb-footer">
        <div style="font-size:9px;color:rgba(255,255,255,0.15);text-align:center;font-family:'DM Mono',monospace">Tap a contact for full analysis</div>
      </div>
    </div>

    <!-- Detail -->
    <div class="detail" id="detail"></div>
  </div>
</div>

<script>
const contacts=[
  {id:0,name:"Sarah Chen",role:"VP of Product",company:"Meridian SaaS",initials:"SC",seedScore:84,renewal:23,trend:[71,74,76,79,81,84],dims:{depth:"Confidant-track",reciprocity:"Highly mutual",momentum:"Accelerating",tone:"Warm"},interactions:{email:[{date:"Jun 3",label:"Q3 Roadmap Review",text:"Hey — I went through your section and it's really strong. The prioritization logic is exactly what the board needs to see. Can we get 30 min before Thursday to align on the narrative?"},{date:"May 28",label:"Re: Launch Timeline",text:"I hear you on the timeline concerns. Honestly I've been feeling the same pressure. Let's make sure we flag this to leadership together rather than each fighting it separately."}],slack:[{date:"Jun 5",label:"#product-sync",text:"looping in @you on this — your context here is invaluable"},{date:"Jun 4",label:"DM",text:"heads up — there might be some reorg chatter this week. not official but wanted you to have context"}],calls:[{date:"Jun 2",label:"1:1 (22 min)",text:"Energy high throughout. Sarah drove most of the agenda. Ended with 'I really value having you on this'."}]}},
  {id:1,name:"Marcus Webb",role:"Engineering Lead",company:"Meridian SaaS",initials:"MW",seedScore:72,renewal:67,trend:[68,70,71,69,72,72],dims:{depth:"Collegial",reciprocity:"Balanced",momentum:"Stable",tone:"Guarded but fair"},interactions:{email:[{date:"Jun 4",label:"API Integration Spec",text:"Comments inline. A few things I'd push back on — the auth flow creates a bottleneck we'll regret. Can we get engineering in the room before this goes to stakeholders?"},{date:"May 30",label:"Re: Sprint Priorities",text:"Moved the ticket to top of queue. I think you called the priority right on this one."}],slack:[{date:"Jun 5",label:"#eng-product",text:"@you was right to flag it early"},{date:"Jun 3",label:"DM",text:"can you clarify what you meant by 'flexible architecture'?"}],calls:[{date:"Jun 1",label:"Technical review (30 min)",text:"Terse in the first half, loosened up after the whiteboard session. Left aligned."}]}},
  {id:2,name:"Priya Nair",role:"Head of Sales",company:"Vertex Co.",initials:"PN",seedScore:31,renewal:14,trend:[58,52,47,41,36,31],dims:{depth:"Surface",reciprocity:"Lopsided",momentum:"Decelerating",tone:"Formal"},interactions:{email:[{date:"Jun 2",label:"Re: Cross-sell proposal",text:"Thanks for this. I'll circle back once I've had a chance to review with the team."},{date:"May 25",label:"Re: Q2 Collab",text:"Makes sense. We can sync sometime next week."}],slack:[{date:"May 30",label:"DM",text:"in back to back all day, will get back to you"}],calls:[{date:"May 28",label:"Intro sync (20 min)",text:"Polite but distracted. Meeting ended 5 min early. Little reciprocal questioning."}]}},
  {id:3,name:"Jordan Ellis",role:"Design Director",company:"Meridian SaaS",initials:"JE",seedScore:91,renewal:89,trend:[78,82,85,87,89,91],dims:{depth:"Confidant",reciprocity:"Mutual",momentum:"Accelerating",tone:"Warm"},interactions:{email:[{date:"Jun 5",label:"Brand refresh concepts",text:"Wanted your gut read before I socialize more broadly — you tend to catch things others miss."},{date:"Jun 1",label:"Re: Deck feedback",text:"This is exactly the note I needed. You saved me from a bad presentation."}],slack:[{date:"Jun 5",label:"DM",text:"ok your instinct on the color system was completely right"},{date:"Jun 3",label:"DM",text:"genuinely one of the most useful convos i've had this quarter. thank you"}],calls:[{date:"Jun 4",label:"Creative review (35 min)",text:"High energy, lots of humor. Ended 10 min late — didn't want to stop."}]}},
  {id:4,name:"Tom Bassett",role:"CFO",company:"Vertex Co.",initials:"TB",seedScore:55,renewal:41,trend:[54,56,53,57,54,55],dims:{depth:"Transactional",reciprocity:"Extractive",momentum:"Stable",tone:"Formal"},interactions:{email:[{date:"Jun 3",label:"Re: Budget approval",text:"Approved. Finance will process by EOW."},{date:"May 29",label:"Re: Q3 headcount",text:"We'll need to revisit in the August planning cycle."}],slack:[{date:"Jun 1",label:"DM",text:"Noted."}],calls:[{date:"May 30",label:"Budget review (25 min)",text:"Precise and efficient. No small talk. Pure transactional register."}]}}
];

const analyzed={};
let liveMode=false;
let activeId=null;

function sc(s){return s>=75?"#4caf7d":s>=50?"#e8a838":"#e05c5c"}

function trendBadge(data){
  const diff=data[data.length-1]-data[0],pct=Math.round(Math.abs(diff/data[0])*100),col=diff>=0?"#4caf7d":"#e05c5c";
  return `<span style="font-size:10px;font-family:'DM Mono',monospace;color:${col};font-weight:500">${diff>=0?"↑":"↓"}${pct}%</span>`;
}

function bar(score){
  return `<div class="bar-track"><div class="bar-fill" style="width:${score}%;background:${sc(score)}"></div></div>`;
}

function arc(score,size=64){
  const c=size/2,r=(size-10)/2,circ=2*Math.PI*r,fill=(score/100)*circ,col=sc(score);
  return `<svg width="${size}" height="${size}" style="flex-shrink:0"><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="5"/><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${col}" stroke-width="5" stroke-dasharray="${fill.toFixed(1)} ${circ.toFixed(1)}" stroke-linecap="round" transform="rotate(-90 ${c} ${c})"/><text x="${c}" y="${c+5}" text-anchor="middle" font-size="13" font-weight="500" fill="${col}" font-family="DM Mono,monospace">${score}</text></svg>`;
}

function chart(data,color){
  const w=240,h=68,px=10,py=8,labels=["5w","4w","3w","2w","1w","Now"];
  const mn=Math.max(0,Math.min(...data)-12),mx=Math.min(100,Math.max(...data)+12),rng=mx-mn||1;
  const pts=data.map((v,i)=>[+(px+(i/(data.length-1))*(w-px*2)).toFixed(1),+(py+(1-(v-mn)/rng)*(h-py*2)).toFixed(1)]);
  const poly=pts.map(p=>p.join(",")).join(" ");
  const fill=`${pts[0][0]},${h} ${poly} ${pts[pts.length-1][0]},${h}`;
  const gid="g"+color.replace('#','');
  const grid=[25,50,75].map(v=>{const y=py+(1-(v-mn)/rng)*(h-py*2);return(y<py-2||y>h-py+2)?"":`<line x1="${px}" y1="${y.toFixed(1)}" x2="${w-px}" y2="${y.toFixed(1)}" stroke="rgba(255,255,255,0.05)" stroke-width="1"/><text x="${px-3}" y="${(y+3).toFixed(1)}" font-size="7" fill="rgba(255,255,255,0.18)" text-anchor="end" font-family="DM Mono,monospace">${v}</text>`;}).join("");
  const dots=pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${color}"/><text x="${p[0]}" y="${h-1}" font-size="7" fill="rgba(255,255,255,0.22)" text-anchor="middle" font-family="DM Mono,monospace">${labels[i]}</text>`).join("");
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" style="display:block;overflow:visible"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="0.2"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>${grid}<polygon points="${fill}" fill="url(#${gid})"/><polyline points="${poly}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>`;
}

function buildPrompt(c){
  const all=[...c.interactions.email.map(m=>`EMAIL (${m.date}) — ${m.label}: "${m.text}"`),...c.interactions.slack.map(m=>`SLACK (${m.date}) — ${m.label}: "${m.text}"`),...(c.interactions.calls||[]).map(m=>`CALL (${m.date}) — ${m.label}: "${m.text}"`)].join("\n\n");
  return `You are an EQ analysis engine for CSMs and AEs. Analyze communication data and return ONLY valid JSON, no markdown:\n{"overall_eq_score":<0-100>,"overall_summary":"<1 crisp sentence>","mood_now":"<3-5 words>","dimension_scores":{"depth":{"score":<0-100>,"insight":"<6-8 words>"},"reciprocity":{"score":<0-100>,"insight":"<6-8 words>"},"momentum":{"score":<0-100>,"insight":"<6-8 words>"},"tone":{"score":<0-100>,"insight":"<6-8 words>"}},"risk_flags":[],"coaching_tips":[{"tip":"<bold action 8-12 words>","note":"<5-7 word signal>"},{"tip":"<action>","note":"<signal>"},{"tip":"<action>","note":"<signal>"}],"next_best_action":"<imperative, 10 words max>"}\n\nContact: ${c.name}, ${c.role}\nDims: Depth: ${c.dims.depth} | Reciprocity: ${c.dims.reciprocity} | Momentum: ${c.dims.momentum} | Tone: ${c.dims.tone}\n\n${all}`;
}

function liveBtnHTML(){
  return `<div class="live-btn" onclick="toggleLive()" style="background:${liveMode?"rgba(76,175,125,0.1)":"rgba(255,255,255,0.04)"};border:0.5px solid ${liveMode?"rgba(76,175,125,0.3)":"rgba(255,255,255,0.09)"}">
    <div style="display:flex;align-items:center;gap:8px">
      <div style="width:6px;height:6px;border-radius:50%;background:${liveMode?"#4caf7d":"rgba(255,255,255,0.2)"};box-shadow:${liveMode?"0 0 6px rgba(76,175,125,0.8)":"none"};${liveMode?"animation:pulse 1.5s infinite":""}"></div>
      <span style="font-size:11px;font-weight:500;color:${liveMode?"#4caf7d":"rgba(255,255,255,0.45)"}">Live Call Mode</span>
    </div>
    <span style="font-size:9px;color:${liveMode?"rgba(76,175,125,0.7)":"rgba(255,255,255,0.2)"};font-family:'DM Mono',monospace">${liveMode?"ON":"OFF"}</span>
  </div>
  ${liveMode?`<div style="padding:8px 10px;border-radius:6px;background:rgba(76,175,125,0.06);border:0.5px solid rgba(76,175,125,0.15);margin-bottom:4px">
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px"><div style="width:5px;height:5px;border-radius:50%;background:#4caf7d;animation:pulse 1.5s infinite"></div><span style="font-size:10px;color:#4caf7d;font-family:'DM Mono',monospace">Listening...</span></div>
    <p style="font-size:10px;color:rgba(255,255,255,0.3);line-height:1.5">Tone, sentiment &amp; expression signals will update EQ scores in real time.</p>
  </div>`:""}`;
}

function renderList(){
  document.getElementById('contact-list').innerHTML=contacts.map(c=>{
    const score=analyzed[c.id]?.overall_eq_score??c.seedScore,col=sc(score),urgent=c.renewal<=30;
    return `<div class="crow${activeId===c.id?" active":""}" onclick="openContact(${c.id})">
      <div class="avatar">${c.initials}</div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div style="display:flex;align-items:center;gap:5px">
            <p style="font-size:13px;font-weight:500;color:rgba(255,255,255,0.85)">${c.name}</p>
            ${urgent?`<span style="font-size:9px;padding:1px 5px;border-radius:3px;background:rgba(224,92,92,0.15);color:#e05c5c;font-family:'DM Mono',monospace">${c.renewal}d</span>`:""}
          </div>
          <div style="display:flex;align-items:center;gap:5px">${trendBadge(c.trend)}<span style="font-size:12px;color:${col};font-family:'DM Mono',monospace;font-weight:600">${score}</span></div>
        </div>
        <p style="font-size:11px;color:rgba(255,255,255,0.35)">${c.role}</p>
        ${bar(score)}
        ${!urgent&&c.renewal?`<div style="margin-top:2px;font-size:9px;color:rgba(255,255,255,0.18);font-family:'DM Mono',monospace">renewal in ${c.renewal}d</div>`:""}
      </div>
    </div>`;
  }).join("");
  document.getElementById('analyzed-count').textContent=`${Object.keys(analyzed).length}/5 analyzed`;
}

function renderInbox(){
  const emails=[
    {from:"sarah.chen@meridiansaas.com",subject:"Q3 Roadmap Review",body:"Hey — I went through your section and it's really strong...",cid:0},
    {from:"marcus.webb@meridiansaas.com",subject:"API Integration Spec",body:"Comments inline. A few things I'd push back on...",cid:1},
    {from:"priya.nair@vertexco.com",subject:"Re: Cross-sell proposal",body:"Thanks for this. I'll circle back once I've had a chance to review...",cid:2}
  ];
  document.getElementById('inbox').innerHTML=emails.map(e=>{
    const s=analyzed[e.cid]?.overall_eq_score;
    return `<div class="mock-email">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <div style="font-size:11px;color:rgba(255,255,255,0.32);font-family:'DM Mono',monospace">${e.from}</div>
        ${s!=null?`<div style="display:flex;align-items:center;gap:4px"><div style="width:5px;height:5px;border-radius:50%;background:${sc(s)}"></div><span style="font-size:10px;color:${sc(s)};font-family:'DM Mono',monospace">EQ ${s}</span></div>`:""}
      </div>
      <div style="font-size:13px;color:rgba(255,255,255,0.82);font-weight:500;margin-bottom:4px">${e.subject}</div>
      <div style="font-size:12px;color:rgba(255,255,255,0.4);line-height:1.6">${e.body}</div>
    </div>`;
  }).join("");
}

function showOverview(){
  document.getElementById('detail').style.display='none';
  document.getElementById('overview').style.display='flex';
  renderList();
}

function showDetail(){
  document.getElementById('overview').style.display='none';
  document.getElementById('detail').style.display='flex';
}

function renderDetailContent(c,r){
  const score=r.overall_eq_score,col=sc(score);
  const tips=(r.coaching_tips||r.coaching_nudges||[]).map(n=>`<div class="nudge"><p style="font-size:12px;font-weight:600;color:rgba(255,255,255,0.85);margin:0 0 3px;line-height:1.5">${n.tip||n.nudge}</p>${(n.note||n.why)?`<p style="font-size:10px;color:rgba(255,255,255,0.32);margin:0;line-height:1.4">${n.note||n.why}</p>`:""}</div>`).join("");
  const dims=Object.entries(r.dimension_scores).map(([d,v])=>`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="font-size:11px;color:rgba(255,255,255,0.38);text-transform:capitalize">${d}</span><span style="font-size:11px;color:${sc(v.score)};font-family:'DM Mono',monospace">${v.score}</span></div>${bar(v.score)}<p style="font-size:10px;color:rgba(255,255,255,0.28);margin:3px 0 0;line-height:1.4">${v.insight}</p></div>`).join("");
  const risks=(r.risk_flags||[]).length?`<div class="clabel" style="margin-bottom:6px">⚠ Risk flags</div>${r.risk_flags.map(f=>`<div class="risk"><p style="font-size:11px;color:#e05c5c;margin:0;line-height:1.5">${f}</p></div>`).join("")}`:"";

  document.getElementById('detail').innerHTML=`
    <button class="back-btn" onclick="goBack()">← all contacts</button>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
      <div class="avatar">${c.initials}</div>
      <div style="flex:1">
        <p style="font-size:14px;font-weight:500;color:rgba(255,255,255,0.9)">${c.name}</p>
        <p style="font-size:11px;color:rgba(255,255,255,0.35)">${c.role} · ${c.company}</p>
        <div style="display:flex;align-items:center;gap:6px;margin-top:3px">${trendBadge(c.trend)}<span style="font-size:9px;color:${c.renewal<=30?"#e05c5c":"rgba(255,255,255,0.22)"};font-family:'DM Mono',monospace">renewal in ${c.renewal}d</span></div>
      </div>
    </div>
    <div id="live-section">${liveBtnHTML()}</div>
    <div class="card fade" style="display:flex;align-items:center;gap:12px">
      ${arc(score,64)}
      <div style="flex:1">
        <div class="clabel">EQ score</div>
        <div style="font-size:11px;color:rgba(255,255,255,0.55);line-height:1.6">${r.overall_summary}</div>
        ${r.mood_now?`<div style="margin-top:5px;display:inline-block;padding:2px 7px;background:rgba(255,255,255,0.06);border-radius:4px;font-size:9px;color:rgba(255,255,255,0.38);font-family:'DM Mono',monospace">${r.mood_now}</div>`:""}
      </div>
    </div>
    <div class="fade"><div class="clabel">Next best action</div><div class="nba"><p style="font-size:12px;color:#4caf7d;font-weight:500;margin:0;line-height:1.5">${r.next_best_action}</p></div></div>
    <div class="fade"><div class="clabel">Coaching tips</div>${tips}</div>
    ${risks?`<div class="fade">${risks}</div>`:""}
    <div class="card fade"><div class="clabel">EQ trend — 6 weeks</div>${chart(c.trend,col)}</div>
    <div class="card fade"><div class="clabel">Analysis</div>${dims}</div>`;
}

async function openContact(id){
  activeId=id;
  liveMode=false;
  const c=contacts.find(x=>x.id===id);
  showDetail();
  renderList();

  if(analyzed[id]){renderDetailContent(c,analyzed[id]);return;}

  document.getElementById('detail').innerHTML=`
    <button class="back-btn" onclick="goBack()">← all contacts</button>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <div class="avatar">${c.initials}</div>
      <div><p style="font-size:14px;font-weight:500;color:rgba(255,255,255,0.9)">${c.name}</p><p style="font-size:11px;color:rgba(255,255,255,0.35)">${c.role}</p></div>
    </div>
    <div id="live-section">${liveBtnHTML()}</div>
    <div style="text-align:center;padding:2rem 0"><div class="spinner"></div><div style="font-size:11px;color:rgba(255,255,255,0.28);font-family:'DM Mono',monospace">analyzing signals...</div></div>`;

  try{
    const res=await fetch("/api/analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-5",max_tokens:1000,messages:[{role:"user",content:buildPrompt(c)}]})});
    const data=await res.json();
    const text=data.content.map(b=>b.text||"").join("");
    const parsed=JSON.parse(text.replace(/```json|```/g,"").trim());
    analyzed[id]=parsed;
    renderDetailContent(c,parsed);
    renderList();
    renderInbox();
  }catch(e){
    document.getElementById('detail').innerHTML+=`<div style="padding:10px;background:rgba(224,92,92,0.1);border:0.5px solid rgba(224,92,92,0.2);border-radius:8px;font-size:12px;color:#e05c5c;margin-top:8px">Analysis failed. Try again.</div>`;
  }
}

function goBack(){
  activeId=null;
  liveMode=false;
  showOverview();
}

function toggleLive(){
  liveMode=!liveMode;
  const ls=document.getElementById('live-section');
  if(ls) ls.innerHTML=liveBtnHTML();
}

renderList();
renderInbox();
</script>
</body>
</html>
